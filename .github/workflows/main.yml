name: Bot Vinted

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vinted-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Lancer le bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Sauvegarder la mémoire anti-doublons
        run: |
          if [ -n "$(git status --porcelain seen.json)" ]; then
            git config user.name "vinted-bot"
            git config user.email "vinted-bot@users.noreply.github.com"
            git add seen.json
            git commit -m "maj seen.json"
            git push
          fi
